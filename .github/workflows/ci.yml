name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run lint

      - name: TypeScript Tests (node + Vitest)
        run: npm test

      - name: Python SDK Tests
        run: python3 tests/test_python_sdk.py

      - name: Python SDK wheel (build, install, import)
        run: |
          python -m pip wheel ./sdk/python -w /tmp/wheels
          pip install /tmp/wheels/*.whl
          cd /tmp && python -c "import agent_viewer; print(agent_viewer.__file__)"

      - name: Build frontend
        run: npm run build

      - name: Build library
        run: npm run build:lib

      - name: Build CLI (bundled server and prebuilt office)
        run: npm run build:cli

      - name: CLI smoke test from the packed tarball
        run: |
          npm pack --ignore-scripts
          mkdir -p /tmp/cli-smoke && cd /tmp/cli-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/warlockcode-agent-viewer-*.tgz
          AGENT_VIEWER_HOME=/tmp/cli-smoke/home npx agent-viewer --no-open --port 4871 --token ci-token > cli.log 2>&1 &
          CLI_PID=$!
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:4871/health && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:4871/ | grep -q '<div id="root">'
          AGENT_VIEWER_HOME=/tmp/cli-smoke/home npx agent-viewer send --agent ci --status working --message "hello from CI"
          curl -fsS -H "Authorization: Bearer ci-token" "http://127.0.0.1:4871/api/v1/events?agentId=ci" | grep -q '"agentId":"ci"'
          kill "$CLI_PID"
          rm -f "$GITHUB_WORKSPACE"/warlockcode-agent-viewer-*.tgz

      - name: Check package (publint + attw)
        run: npm run check:package

      - name: Docker Build (office + API image, the published default)
        run: docker build -f docker/Dockerfile .

      - name: Docker Build (API image)
        run: docker build -f docker/Dockerfile --target api .

      - name: Docker Build (viewer image)
        run: docker build -f docker/Dockerfile --target viewer --build-arg VITE_AGENT_VIEWER_API_URL=http://localhost:8787 .
