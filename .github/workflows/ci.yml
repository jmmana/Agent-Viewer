name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run lint

      - name: TypeScript Tests (node + Vitest)
        run: npm test

      - name: Python SDK Tests
        run: python3 tests/test_python_sdk.py

      - name: Build frontend
        run: npm run build

      - name: Build library
        run: npm run build:lib

      - name: Check package (publint + attw)
        run: npm run check:package

      - name: Docker Build
        run: docker build -f docker/Dockerfile .
