# Prepares the GitHub Copilot coding agent with the same tools as CI (.github/workflows/ci.yml):
# Node 24 with the npm dependencies installed, and Python for the SDK tests and the wheel build.
# GitHub runs this job before every agent session; the job name must be `copilot-setup-steps`.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # GitHub applies this limit to the whole agent session, not only to the setup: 59 is the maximum.
    timeout-minutes: 59
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Check the toolchain
        run: |
          node --version
          npm --version
          python3 --version
          npx tsc --version
