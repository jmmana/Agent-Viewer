name: Release

# Runs when a version tag such as v0.2.0 is pushed.
# 1. Verifies and packs the library and attaches the .tgz to the GitHub release.
# 2. Publishes to npm only when the NPM_TOKEN secret exists (to be configured by the package owner).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check version matches tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Typecheck and tests
        run: |
          npm run lint
          npm test

      - name: Build and check package
        run: |
          npm run build:lib
          npm run check:package

      - name: Pack
        run: npm pack

      - name: Attach package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" warlockcode-agent-viewer-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" warlockcode-agent-viewer-*.tgz --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured: skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts
