name: Release

# Runs when a version tag such as v0.3.0 is pushed.
# 1. Verifies and packs the package (library and CLI) and attaches the .tgz to the GitHub release.
# 2. Publishes to npm only when the NPM_TOKEN secret exists (to be configured by the package owner).
# 3. Builds the Docker images and pushes them to GitHub Container Registry:
#    ghcr.io/jmmana/agent-viewer:<version>      office + API in one container (target app), also :latest
#    ghcr.io/jmmana/agent-viewer:<version>-api  API only (target api), also :latest-api

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check version matches tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Typecheck and tests
        run: |
          npm run lint
          npm test

      - name: Build and check package
        run: |
          npm run build:lib
          npm run build:cli
          npm run check:package

      - name: Pack
        run: npm pack

      - name: Attach package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" warlockcode-agent-viewer-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" warlockcode-agent-viewer-*.tgz --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured: skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts

  docker:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jmmana/agent-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 images)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for the office + API image
        id: app-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=Agent Viewer
            org.opencontainers.image.description=Agent Viewer office and ingestion API in one container

      - name: Build and push the office + API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tags for the API image
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
            suffix=-api,onlatest=true
          labels: |
            org.opencontainers.image.title=Agent Viewer API
            org.opencontainers.image.description=Agent Viewer ingestion API (REST, batch, SSE, webhooks)

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR creates a new package as private, and the GITHUB_TOKEN cannot change that. Until the owner makes it
      # public once, `docker pull` without logging in fails. The summary says so on every release.
      - name: Image visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/agent-viewer" --jq .visibility 2>/dev/null || echo unknown)
          settings="https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/agent-viewer/settings"
          {
            echo "## Container images"
            echo ""
            echo "Published \`${IMAGE}\` (office and API) and the \`-api\` tags (API only)."
            echo ""
            echo "Package visibility: **${visibility}**."
            if [ "$visibility" != "public" ]; then
              echo ""
              echo "GHCR creates new packages as **private**, and this workflow cannot change that. If this is the first publish (or the visibility above is not public), make the package public once so \`docker pull ${IMAGE}\` works without logging in: open ${settings}, then Danger Zone > Change visibility > Public."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$visibility" != "public" ]; then
            echo "::warning title=GHCR package visibility::${IMAGE} is ${visibility}. Make it public once in ${settings} (Danger Zone > Change visibility)."
          fi
