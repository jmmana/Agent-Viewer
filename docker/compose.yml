# Run from the repository root: docker compose -f docker/compose.yml up --build
# Office: http://localhost:3000  Ingestion API: http://localhost:8787
# The API never runs without a token. Set AGENT_VIEWER_API_TOKEN before `up` to choose it; otherwise the api
# service generates one on first start, keeps it in its volume and prints it (docker compose logs api). Open
# the office with it in the fragment: http://localhost:3000/?mode=live#token=<token>
name: agent-viewer

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    init: true
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - AGENT_VIEWER_API_TOKEN=${AGENT_VIEWER_API_TOKEN:-}
      - AGENT_VIEWER_STORAGE=sqlite
      - AGENT_VIEWER_SQLITE_PATH=/app/data/agent-viewer.db
      # Must match the origin the browser loads the office from (the viewer service below).
      - AGENT_VIEWER_CORS_ORIGIN=http://localhost:3000
      - AGENT_VIEWER_MAX_BATCH_SIZE=100
      - AGENT_VIEWER_RATE_LIMIT=1000
    volumes:
      - agent_viewer_data:/app/data
    restart: unless-stopped

  viewer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: viewer
      args:
        # Read by Vite at build time and used by the browser, so it is the API address as seen from the
        # host (the published port above), not http://api:8787. Change it and rebuild if you publish the
        # API elsewhere, and update AGENT_VIEWER_CORS_ORIGIN to match.
        VITE_AGENT_VIEWER_API_URL: http://localhost:8787
        VITE_AGENT_VIEWER_MODE: live
    init: true
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  agent_viewer_data:
    driver: local
