[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-viewer"
version = "0.8.0"
description = "Python client SDK for Agent Viewer multi-agent visual observability"
readme = "README.md"
authors = [{ name = "Juan Manuel Castillo Pinto (WarlockCode)" }]
license = "MIT"
requires-python = ">=3.9"
# The SDK uses only the standard library (urllib), so it has no runtime dependencies.
dependencies = []
keywords = ["ai-agents", "agent-observability", "multi-agent", "llm", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/jmmana/Agent-Viewer"
Documentation = "https://github.com/jmmana/Agent-Viewer/blob/main/docs/integration.md"
Issues = "https://github.com/jmmana/Agent-Viewer/issues"
Changelog = "https://github.com/jmmana/Agent-Viewer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
# LangGraph callback handler (agent_viewer_langgraph.py, issue #345). The core SDK stays dependency-free.
langgraph = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
]

[tool.setuptools]
# The SDK is two single-file modules (agent_viewer.py and the optional agent_viewer_langgraph.py), not a package.
py-modules = ["agent_viewer", "agent_viewer_langgraph"]
