[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-viewer"
version = "1.0.0"
description = "Python client SDK for Agent Viewer multi-agent visual observability"
readme = "../../README.md"
authors = [{ name = "Juan Manuel Castillo Pinto (WarlockCode)" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_viewer*"]
